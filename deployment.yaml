apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-monolith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-monolith
  template:
    metadata:
      labels:
        app: erp-monolith
    spec:
      containers:
        - name: erp
          image: example/erp-monolith:oom-lab
          env:
            - name: ERP_LEAK_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: erp-monolith
spec:
  selector:
    app: erp-monolith
  ports:
    - port: 80
      targetPort: 8080